
name: Auto Generate Bangla Shorts

on:
  schedule:
    - cron: '0 3 * * *'   # বাংলাদেশ সময় সকাল ৯:০০টা
    - cron: '0 14 * * *'  # বাংলাদেশ সময় রাত ৮:০০টা

  workflow_dispatch:
    inputs:
      row_number:
        description: 'Google Sheet Row Number'
        required: false
        type: string

      topic:
        description: 'Shorts Topic'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shorts-video-generator
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generator
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          ROW_NUMBER: ${{ inputs.row_number }}
          TOPIC: ${{ inputs.topic }}

          PYTHONUNBUFFERED: "1"

        run: python make_shorts.py
